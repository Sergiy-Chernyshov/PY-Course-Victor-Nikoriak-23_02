<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Excel Report Generator</title>

    <style>
        :root {
            --bg: #eef3f8;
            --panel: #ffffff;
            --ink: #172033;
            --muted: #69758a;
            --line: #d8e0ea;
            --accent: #1f6feb;
            --accent-dark: #174ea6;
            --soft: #e8f1ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(31, 111, 235, 0.12), transparent 36%),
                linear-gradient(225deg, rgba(16, 185, 129, 0.12), transparent 34%),
                repeating-linear-gradient(
                    45deg,
                    rgba(23, 32, 51, 0.025) 0,
                    rgba(23, 32, 51, 0.025) 1px,
                    transparent 1px,
                    transparent 12px
                ),
                var(--bg);
        }

        .shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(31, 111, 235, 0.28);
        }

        .brand-title {
            margin: 0;
            font-size: 22px;
        }

        .brand-subtitle {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .container {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 26px;
            box-shadow: 0 18px 45px rgba(23, 32, 51, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        h2 {
            margin-top: 32px;
            font-size: 20px;
        }

        p {
            color: var(--muted);
        }

        .upload-panel {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            padding: 22px;
            border: 1px dashed #9ab7e8;
            border-radius: 8px;
            background: var(--soft);
        }

        input[type="file"] {
            width: 100%;
            padding: 14px;
            background: white;
            border: 1px solid var(--line);
            border-radius: 6px;
        }

        button,
        a.button {
            display: inline-block;
            padding: 11px 18px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(31, 111, 235, 0.22);
        }

        button:hover,
        a.button:hover {
            background: var(--accent-dark);
        }

        a.button.secondary {
            background: #64748b;
            box-shadow: none;
        }

        a.button.secondary:hover {
            background: #475569;
        }

        .error {
            padding: 12px;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, minmax(120px, 1fr));
            gap: 12px;
            margin: 22px 0;
        }

        .stat {
            background: #f8fafc;
            border: 1px solid var(--line);
            padding: 14px;
            border-radius: 8px;
            color: var(--muted);
        }

        .stat strong {
            display: block;
            margin-top: 8px;
            font-size: 22px;
            color: var(--ink);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
            background: white;
        }

        th,
        td {
            border: 1px solid var(--line);
            padding: 9px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #e8f1ff;
        }

        .task-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 18px;
            margin-top: 24px;
        }

        .task-card {
            display: block;
            padding: 22px;
            min-height: 170px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background:
                linear-gradient(135deg, rgba(31, 111, 235, 0.12), transparent),
                #ffffff;
            text-decoration: none;
            color: var(--ink);
            box-shadow: 0 14px 30px rgba(23, 32, 51, 0.08);
        }

        .task-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .task-card strong {
            display: block;
            margin-top: 12px;
            font-size: 22px;
        }

        .task-card small {
            display: block;
            margin-top: 12px;
            color: var(--muted);
            line-height: 1.4;
        }

        .task-label {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 6px;
            background: var(--soft);
            color: var(--accent-dark);
            font-weight: 700;
            font-size: 13px;
        }

        @media (max-width: 780px) {
            .stats,
            .task-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 18px;
            }

            table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">XL</div>
            <div>
                <h1 class="brand-title">Excel Report Generator</h1>
                <p class="brand-subtitle">Обробка файлів та формування звітів</p>
            </div>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
